# Builds FlexTip-Forever.zip and puts it on a GitHub release.
#
# Two ways to use it:
# - Publish a release on GitHub; this runs on its own and attaches the zip.
# - Actions > Release zip > Run workflow, with a tag like v1.3.0. If there is no
#   release with that tag yet, it creates the tag and the release from main, with
#   the notes in .github/release-notes/<tag>.md. If the release exists, it
#   rebuilds the zip from the tag and replaces the old one.
#
# It never runs on a plain push, so only someone with access to the Actions tab
# or the release form can publish a release.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, like v1.3.0"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Use the tag's code if the tag already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "$TAG"
            echo "Building the existing tag $TAG."
          else
            echo "Tag $TAG doesn't exist yet; building $(git rev-parse --short HEAD) from $GITHUB_REF_NAME."
          fi

      - name: Check that FlexTip.toc has the release's version
        run: |
          version=$(sed -n 's/^## Version: *//p' FlexTip.toc | tr -d '\r')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::FlexTip.toc says version $version, but the release tag is $TAG. Bump the version in FlexTip.toc and Core.lua, or fix the tag."
            exit 1
          fi

      - name: Run the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-check
          tests/run.sh

      # The folder inside must be named FlexTip for WoW to load the addon.
      # .gitattributes keeps tests, docs and .github out of the zip.
      - name: Build FlexTip-Forever.zip
        run: git archive --format=zip --prefix=FlexTip/ -o FlexTip-Forever.zip HEAD

      - name: Put the zip on the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" FlexTip-Forever.zip --clobber --repo "$GITHUB_REPOSITORY"
            echo "Attached FlexTip-Forever.zip to the existing release $TAG."
          else
            notes=".github/release-notes/$TAG.md"
            if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
            gh release create "$TAG" FlexTip-Forever.zip --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" --title "FlexTip ${TAG#v}" "$@"
            echo "Created release $TAG with FlexTip-Forever.zip."
          fi
